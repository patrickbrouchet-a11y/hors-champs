# Déploie la landing HORS CHAMP sur le VPS Hostinger (SSH + rsync) à chaque merge sur main.
# Site : https://horschamps.patrick-brouchet.cloud — dossier distant : /var/www/horschamps/
# Secrets à créer dans GitHub > Settings > Secrets and variables > Actions :
#   SSH_HOST         IP du VPS
#   SSH_USER         utilisateur de déploiement (ex. deploy)
#   SSH_PRIVATE_KEY  clé privée dédiée au déploiement (contenu complet du fichier)
#   SSH_KNOWN_HOSTS  sortie de : ssh-keyscan -t ed25519 <IP du VPS>
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hors-champs
  cancel-in-progress: true

env:
  REMOTE_DIR: /var/www/horschamps/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Préparer la clé SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Envoyer dist/ sur le VPS
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${REMOTE_DIR}"
