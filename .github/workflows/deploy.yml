# Déploie HORS CHAMP sur le VPS Hostinger (modèle Docker + Traefik) à chaque push sur main.
# 1. Vérifie que le site se construit.
# 2. Demande à Hostinger de reconstruire le projet Docker « horschamps » :
#    le VPS récupère main depuis GitHub, construit l'image (Dockerfile) et relance le conteneur.
# Secret requis (GitHub > Settings > Secrets and variables > Actions) :
#   HOSTINGER_API_TOKEN   jeton API créé dans hPanel > Profil > API
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hors-champs
  cancel-in-progress: true

env:
  VPS_ID: 2127691
  PROJECT: horschamps

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Vérifier le build
        run: npm ci && npm run build

      - name: Reconstruire le conteneur sur le VPS
        env:
          TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret HOSTINGER_API_TOKEN manquant (voir DEPLOY.md)."
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/json" \
            "https://developers.hostinger.com/api/vps/v1/virtual-machines/${VPS_ID}/docker/${PROJECT}/update"
